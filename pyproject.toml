[project]
name = "autoeval-service"
version = "2.0.0"
description = "Autoeval service powering the autoeval comparison dashboard"
authors = [
    {name = "Sebastian", email = "sebastian.franz@tum.de"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis>=7.2.1",
    "fastapi>=0.141.1,<0.150.0",
    "uvicorn>=0.52.3,<0.60.0",
    "requests>=2.34.2,<2.40.0",
    "biotrainer-core>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoeval_service"]

[tool.uv]
exclude-newer = "7 days"  # Minimum release age of pypi packages: 7 days

[tool.uv.sources]
biotrainer-core = { git = "https://github.com/biocentral/biotrainer.git", branch = "refactoring/autoeval", subdirectory = "biotrainer-core" }